name: Build DG Play Screen APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Condor P6 Pro (Android 6/7 MultiDex & UI)
        run: |
          python3 -c '
          p = "android"
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:{p}="http://schemas.{p}.com/apk/res/{p}">
              <uses-permission {p}:name="{p}.permission.INTERNET" />
              <uses-permission {p}:name="{p}.permission.ACCESS_NETWORK_STATE" />
              <uses-permission {p}:name="{p}.permission.ACCESS_WIFI_STATE" />
              <uses-permission {p}:name="{p}.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission {p}:name="{p}.permission.VIBRATE" />
              <application {p}:name="androidx.multidex.MultiDexApplication" {p}:allowBackup="true" {p}:label="DG Play Screen" {p}:supportsRtl="true" {p}:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity {p}:name=".MainActivity" {p}:configChanges="orientation|screenSize|keyboardHidden" {p}:exported="true">
                      <intent-filter>
                          <action {p}:name="{p}.intent.action.MAIN" />
                          <category {p}:name="{p}.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)

          gradle = open("app/build.gradle").read()
          if "multiDexEnabled" not in gradle:
              gradle = gradle.replace("versionName \"1.2\"", "versionName \"1.3\"\n        multiDexEnabled true")
          if "multidex:2.0.1" not in gradle:
              gradle = gradle.replace("dependencies {", "dependencies {\n    implementation \"androidx.multidex:multidex:2.0.1\"")
          open("app/build.gradle", "w").write(gradle)

          for path in ["app/src/main/res/layout/activity_main.xml", "app/src/main/res/layout/item_channel.xml"]:
              txt = open(path).read()
              txt = txt.replace("paddingHorizontal=", "paddingLeft=").replace("layout_marginHorizontal=", "layout_marginLeft=").replace("layout_marginVertical=", "layout_marginTop=")
              txt = txt.replace("org.videolan.libvlc.util.VLCVideoLayout", "FrameLayout")
              open(path, "w").write(txt)

          kt = open("app/src/main/java/com/dg/playscreen/MainActivity.kt").read()
          kt = kt.replace("private lateinit var vlcVideoLayout: VLCVideoLayout", "private lateinit var vlcVideoLayout: FrameLayout")
          kt = kt.replace("mediaPlayer?.attachViews(vlcVideoLayout, null, false, false)", "val v = VLCVideoLayout(this); vlcVideoLayout.addView(v); mediaPlayer?.attachViews(v, null, false, false)")
          open("app/src/main/java/com/dg/playscreen/MainActivity.kt", "w").write(kt)
          '
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DG-Play-Screen-APKs
          path: app/build/outputs/apk/debug/*.apk
